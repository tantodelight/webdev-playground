<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="wrapper">
        <h1>Welcome to my amazing tic tac toe</h1>
        <section class="players" aria-label="Player names">
            <label for="player-x">Player X
                <input id="player-x" type="text" value="Player 1" maxlength="24" autocomplete="off">
            </label>
            <label for="player-o">Player O
                <input id="player-o" type="text" value="Player 2" maxlength="24" autocomplete="off">
            </label>
        </section>
        <div class="grid-container">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
        <div class="output" role="status" aria-live="polite"></div>
        <button class="restart-btn" type="button">Start Game</button>
    </div>

</body>
</html>
