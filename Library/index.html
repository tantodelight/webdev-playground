<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Library</title>
</head>
<body>
  <h1>Library</h1>

  <div class="grid-container"> 

  </div>

  <dialog class="book-dialog">
    <form id="book-form">
      <h3>Enter Details of New Book</h3>

      <label>
        Title:
        <input type="text" id="title" name="title" required>
      </label>
      <label>
        Author:
        <input type="text" id="author" name="author" required>
      </label>
      <label>
        Pages:
        <input type="number" id="pages" name="pages" min="0" required>
      </label>
      <label>
        Read Status(select if read):
        <input type="checkbox" id="read" name="read">
      </label>

      <div class="button-group">
        <button type="submit" id="submit-btn">Submit</button>
        <button type="button" id="cancel-btn">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog class="read-dialog">
    <form id="read-form">
      <h3>Change Read Status</h3>

      <label>
        Read:
        <input type="checkbox" id="read-status" name="read-status">
      </label>

      <div class="button-group">
        <button type="submit" id="update-btn">Update</button>
        <button type="button" id="cancel-read-btn">Cancel</button>
      </div>
    </form>
  </dialog>

  <button class="new-book-btn">New Book</button>
</body>
</html>
